name: unidti
channels:
  - https://mirrors.bfsu.edu.cn/anaconda/pkgs/main
  - defaults
  - conda-forge
dependencies:
  - python=3.9
  - rdkit
  - numpy=1.26.3
  - pandas=1.5.3
  - scikit-learn=1.4.2
  - scipy=1.10.1
  - tqdm
  - prettytable
  - yacs
  - einops
  - networkx=3.2.1
  - dill
  - packaging
  - matplotlib-base
  - seaborn
  - sqlalchemy
  - pyyaml
  - pip
  - pip:
      - dgllife==0.3.2
      - torchdata==0.7.1
      - pydantic
      - statsmodels
      - hyperopt
      - joblib